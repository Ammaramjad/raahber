 [build-system]
 requires = ["setuptools>=61", "wheel"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "topo-fer"
 version = "0.1.0"
 description = "TOPO-FER: Open-World Expression Manifold Topology for Facial Expression Recognition"
 readme = "README.md"
 authors = [
     { name = "TOPO-FER Authors" }
 ]
 requires-python = ">=3.9"
 classifiers = [
     "Programming Language :: Python :: 3",
     "License :: OSI Approved :: MIT License",
     "Operating System :: OS Independent"
 ]
 dependencies = [
        "torch>=2.0.0",
        "torchvision>=0.15.0",
        "torchaudio>=2.0.0",
        "torchdiffeq>=0.2.3",
        "numpy>=1.23",
        "scipy>=1.9",
        "scikit-learn>=1.2",
        "pillow>=9.5",
        "giotto-tda>=0.6.0",
        "hdbscan>=0.8.33",
        "matplotlib>=3.7",
        "pandas>=1.5",
        "tqdm>=4.65",
        "pyyaml>=6.0",
        "hydra-core>=1.3"
 ]

 [project.optional-dependencies]
 dev = [
     "pytest>=7.2",
     "black>=23.0",
     "ruff>=0.1.0",
     "mypy>=1.3",
     "pre-commit>=3.3"
 ]
