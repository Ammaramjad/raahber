 [build-system]
 requires = ["setuptools>=61", "wheel"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "topo-fer"
 version = "0.1.0"
 description = "TOPO-FER: Open-World Expression Manifold Topology for Facial Expression Recognition"
 authors = [
     { name = "TOPO-FER Authors" }
 ]
 readme = "README.md"
 requires-python = ">=3.10"
 license = { text = "MIT" }
 classifiers = [
     "Programming Language :: Python :: 3",
     "License :: OSI Approved :: MIT License",
     "Operating System :: OS Independent"
 ]
 dependencies = [
      "torch>=2.2",
      "torchvision>=0.17",
      "torchaudio>=2.2",
      "torchdiffeq>=0.2.3",
      "pytorch-lightning>=2.2",
      "numpy>=1.24",
      "scikit-learn>=1.3",
      "pandas>=2.1",
      "pyyaml>=6.0",
      "omegaconf>=2.3",
      "hydra-core>=1.3",
      "albumentations>=1.4",
      "opencv-python>=4.8",
      "matplotlib>=3.8",
      "seaborn>=0.13",
      "ripser>=0.6",
      "persim>=0.3",
      "networkx>=3.1",
      "tqdm>=4.65",
      "rich>=13.6",
      "tensorboard>=2.15",
      "hdbscan>=0.8.33"
 ]

 [project.optional-dependencies]
 dev = [
     "pytest>=7.4",
     "pytest-cov>=4.1",
     "mypy>=1.7",
     "black>=23.11",
     "ruff>=0.1.5"
 ]

